version: '3.8'

services:
  # Production build
  trello-lite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trello-lite-prod
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - trello-network

networks:
  trello-network:
    driver: bridge
